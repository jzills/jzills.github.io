<!doctype html>
<!--
  Source for public/og-image.png, the link-preview image (1200x627).
  Layout "a" is the one in use; "b" (?v=b) is the centred alternative.
  To regenerate, screenshot this page at 1200x627 with a headless browser
  once its fonts have loaded, e.g. with Playwright:
    page.setViewportSize({ width: 1200, height: 627 })
    page.goto('file://.../scripts/og-image.html'); await document.fonts.ready
    page.screenshot({ path: 'public/og-image.png' })
  Then bump the ?v= on the og:image URLs in index.html so previews refresh.
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #09090b; --fg: #fafafa; --muted: #8b8b94; --accent: #22d3ee; --border: #27272a; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 627px; background: var(--bg); overflow: hidden; }
  canvas { position: absolute; inset: 0; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .sans { font-family: 'Inter', sans-serif; }
  .mark { color: var(--accent); font-weight: 500; letter-spacing: -0.02em; line-height: 1; }

  /* A: monogram left, text right */
  .a { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 96px; gap: 72px; }
  .a .mark { font-size: 260px; }
  .a .rule { width: 1px; flex-shrink: 0; align-self: stretch; margin: 150px 0; background: var(--border); }
  .a h1 { font-size: 64px; font-weight: 700; color: var(--fg); letter-spacing: -0.03em; line-height: 1.02; }
  .a .head { margin-top: 20px; font-size: 25px; white-space: nowrap; color: var(--accent); }
  .a .tag { margin-top: 18px; font-size: 21px; color: var(--muted); line-height: 1.5; max-width: 520px; }

  /* B: monogram centred as now, name and headline beneath */
  .b { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .b .mark { font-size: 200px; margin-top: -24px; }
  .b h1 { margin-top: 34px; font-size: 54px; font-weight: 700; color: var(--fg); letter-spacing: -0.03em; }
  .b .head { margin-top: 14px; font-size: 24px; color: var(--muted); }
  .b .head span { color: var(--accent); }

  .url { position: absolute; right: 44px; bottom: 34px; font-size: 18px; color: var(--muted); }
  .url span { color: var(--accent); }
  .center-url .url { right: auto; left: 50%; transform: translateX(-50%); }
</style>
</head>
<body>
<canvas id="w" width="1200" height="627"></canvas>
<div id="root"></div>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'a'
  // The hero's waveform, frozen at one moment: same three waves as the site.
  const ctx = document.getElementById('w').getContext('2d')
  const W = 1200, H = 627, cy = v === 'a' ? H * 0.5 : H * 0.44, t = 3.1
  const noise = (x) => Math.sin(x * 1.7) * 0.5 + Math.sin(x * 3.3) * 0.3 + Math.sin(x * 0.7) * 0.2
  const waves = [
    { freq: 0.008, amp: 0.07, speed: 0.004, phase: 0 },
    { freq: 0.012, amp: 0.045, speed: 0.007, phase: Math.PI * 0.6 },
    { freq: 0.005, amp: 0.1, speed: 0.002, phase: Math.PI * 1.3 },
  ]
  ctx.strokeStyle = 'rgba(34, 211, 238, 0.22)'
  ctx.lineWidth = 2
  for (const wave of waves) {
    ctx.beginPath()
    for (let x = 0; x <= W; x += 2) {
      const amp = H * wave.amp * (1 + noise(x * 0.003 + t * 0.5 + wave.phase) * 0.4)
      const y = cy + Math.sin(x * wave.freq + t * wave.speed * 60 + wave.phase) * amp
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)
    }
    ctx.stroke()
  }
  if (v === 'b') document.body.classList.add('center-url')
  const url = '<p class="url mono"><span>›</span> jzills.github.io</p>'
  document.getElementById('root').innerHTML = v === 'a'
    ? `<div class="a"><div class="mark mono">jz.</div><div class="rule"></div><div>
         <h1 class="sans">Joshua<br>Zillwood</h1>
         <p class="head mono">Platform &amp; Software Engineer</p>
         <p class="tag sans">Developer platforms, cloud infrastructure and AI-assisted engineering.</p>
       </div></div>${url}`
    : `<div class="b"><div class="mark mono">jz.</div>
         <h1 class="sans">Joshua Zillwood</h1>
         <p class="head mono"><span>&gt;</span> Platform &amp; Software Engineer</p>
       </div>${url}`
</script>
</body>
</html>
