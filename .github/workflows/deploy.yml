name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  # Weekly rebuild so the search picks up README changes in the project repos.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deploy at a time. Pages rejects a deployment while another is in progress,
# so merges that land close together used to fail the earlier run. Now a newer
# run waits instead, and a run still waiting is replaced by a newer one. A deploy
# already running is never cancelled partway.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Includes the assistant's knowledge base validation.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
